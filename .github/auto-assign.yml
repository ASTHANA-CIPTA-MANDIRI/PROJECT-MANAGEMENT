# Auto-assign configuration (wow-actions/auto-assign).
#
# Assigns the person who opened the PR/issue to it. Reviewers are disabled
# because requesting a review requires other repo collaborators (and you can't
# review your own PR). To re-enable, set addReviewers: true and list actual
# collaborators under `reviewers:`.

# Request reviewers on new PRs.
addReviewers: false

# Assign the PR/issue author to it.
addAssignees: author

# Titles containing these keywords are skipped.
skipKeywords:
  - wip
