name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# The default GITHUB_TOKEN is read-only; assigning an author / requesting
# reviewers needs write access to issues and pull requests.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: wow-actions/auto-assign@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_FILE: .github/auto-assign.yml
