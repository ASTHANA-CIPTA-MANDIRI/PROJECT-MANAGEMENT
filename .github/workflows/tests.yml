name: CI

on:
  # Every branch, not just main/master/dev: remediation work happens on
  # feature branches (e.g. jarne) and needs the same Pint/PHPStan/tests/
  # coverage gate before it ever reaches a pull request, not just after.
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master, dev ]

jobs:

  lint:
    name: Code style & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test app tests

      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --no-progress

  phpunit:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          extensions: iconv, mbstring, pdo, pdo_sqlite, sqlite3, gd, zip, bcmath, intl, fileinfo, exif, dom, curl
          # pcov measures coverage; it is not available in the local MAMP build.
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite with coverage
        # Tests run against SQLite in-memory (see phpunit.xml), so no database
        # service is needed. The long per-file coverage table is written to the
        # clover file (read by the gate below) instead of stdout, so any test
        # failure stays the last thing printed and is easy to spot.
        run: |
          vendor/bin/phpunit \
            --coverage-clover=coverage.clover \
            --log-junit=junit.xml

      - name: Enforce minimum coverage
        run: |
          php -r '
            $threshold = 70.0;
            $xml = simplexml_load_file("coverage.clover");
            $metrics = $xml->project->metrics;
            $statements = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            $percent = $statements ? $covered / $statements * 100 : 0;
            printf("Line coverage: %.2f%% (%d/%d), minimum %.1f%%\n",
              $percent, $covered, $statements, $threshold);
            if ($percent < $threshold) {
              echo "Coverage is below the minimum.\n";
              exit(1);
            }
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage.clover
            junit.xml

  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: surfaces known vulnerabilities in the CI log without
    # blocking merges. It stays non-blocking while the app is on Laravel 9
    # (EOL, so it carries framework advisories); make it required once the
    # framework upgrade lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        # Report abandoned packages (currently transitive deps of Filament 2,
        # unavoidable until the Filament 3 upgrade) but only fail on actual
        # security advisories, so a real vulnerability stands out.
        run: composer audit --abandoned=report

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: npm audit (fail only on critical)
        run: npm audit --audit-level=critical
