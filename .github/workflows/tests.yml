name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:

  phpunit:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: iconv, mbstring, pdo, pdo_sqlite, sqlite3, gd, zip, bcmath, intl, fileinfo, exif, dom, curl
          # pcov measures coverage; it is not available in the local MAMP build.
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite with coverage
        # Tests run against SQLite in-memory (see phpunit.xml), so no database
        # service is needed.
        run: |
          vendor/bin/phpunit \
            --coverage-text \
            --coverage-clover=coverage.clover \
            --log-junit=junit.xml

      - name: Enforce minimum coverage
        run: |
          php -r '
            $threshold = 70.0;
            $xml = simplexml_load_file("coverage.clover");
            $metrics = $xml->project->metrics;
            $statements = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            $percent = $statements ? $covered / $statements * 100 : 0;
            printf("Line coverage: %.2f%% (%d/%d), minimum %.1f%%\n",
              $percent, $covered, $statements, $threshold);
            if ($percent < $threshold) {
              echo "Coverage is below the minimum.\n";
              exit(1);
            }
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.clover
            junit.xml
