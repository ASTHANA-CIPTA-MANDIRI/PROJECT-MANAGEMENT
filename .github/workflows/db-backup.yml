name: Database backup

# On-demand database backup. The nightly schedule is paused until the
# "production" GitHub Environment exists (see Settings -> Environments) --
# until then this job has no server to reach and would just fail every
# night. Re-add `schedule: - cron: '0 2 * * *'` once production is live.
on:
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up production database
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Run backup over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            bash scripts/db-backup.sh scheduled
