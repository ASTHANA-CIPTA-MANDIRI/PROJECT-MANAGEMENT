version: "3.3"

volumes:
  mysql_data:
  # Uploaded files (spatie/laravel-medialibrary stores them under
  # storage/app/media). Without this they live only in the container's writable
  # layer and are lost the moment it is recreated — including on every
  # `docker compose up --build`.
  storage_data:

services:
  sqldb:
    # 5.7 reached MySQL's own end-of-life in October 2023 and stopped
    # receiving security patches; 8.0 is the actively supported LTS series
    # and is what Laravel 9 + PHP 8.2's pdo_mysql already target.
    image: mysql:8.0
    container_name: helper-mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      # Same defaults as before out of the box, but now overridable from the
      # .env file next to this one — see APP_KEY above for how Compose reads
      # it. Change these before exposing the database beyond this Compose
      # network's internal DNS.
      - MYSQL_DATABASE=helper
      - MYSQL_USER=helper
      - MYSQL_PASSWORD=${DB_PASSWORD:-helper}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-helper}
    command: --default-storage-engine innodb
    restart: unless-stopped
    healthcheck:
      test: mysqladmin -p$$MYSQL_ROOT_PASSWORD ping -h localhost
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3
  helper:
    # Built from this repository's Dockerfile. It used to pull
    # eloufirhatim/helper:latest, but that is the upstream project's image,
    # built from a different codebase — and the workflow that published it has
    # been removed, so nothing publishes an image for this repository.
    build: .
    image: helper:local
    container_name: helper-server
    environment:
      # The image no longer ships an APP_KEY, so every installation supplies
      # its own — a key baked into a published image would be shared by every
      # pull of it. Compose reads this from the .env file next to this one (or
      # from your shell); generate it once and keep it stable, since changing
      # it invalidates all sessions and encrypted values:
      #
      #     docker run --rm helper:local php artisan key:generate --show
      - APP_KEY=${APP_KEY:?generate one with "php artisan key:generate --show" and put it in .env}
      - DB_CONNECTION=mysql
      - DB_HOST=sqldb
      - DB_PORT=3306
      - DB_DATABASE=helper
      - DB_USERNAME=helper
      - DB_PASSWORD=${DB_PASSWORD:-helper}
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.mailtrap.io
      - MAIL_PORT=2525
      - MAIL_USERNAME=your_username
      - MAIL_PASSWORD=your_password
      - MAIL_ENCRYPTION=tls
    depends_on:
      - sqldb
    # The entrypoint retries the migration while MySQL starts, but the
    # container should also come back on its own after a crash or a reboot.
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - storage_data:/app/storage/app
      - /etc/localtime:/etc/localtime
