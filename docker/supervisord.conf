; Process manager for the application image. `artisan serve` used to be both
; the web server and PID 1; the container now runs nginx, PHP-FPM and the
; queue worker as supervised processes, all logging to the container's
; stdout/stderr.
;
; Everything supervisord writes lives under /tmp because the container runs as
; www-data (see Dockerfile), which cannot write to /var/run or /var/log.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 --nodaemonize --fpm-config /etc/php/8.2/fpm/php-fpm-docker.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --max-time recycles the worker hourly so long-lived processes do not hold on
; to stale code or leaked memory. stopwaitsecs gives an in-flight job time to
; finish before supervisord escalates to SIGKILL.
[program:queue]
command=/usr/bin/php /app/artisan queue:work --tries=3 --sleep=3 --max-time=3600
directory=/app
autostart=true
autorestart=true
priority=30
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
