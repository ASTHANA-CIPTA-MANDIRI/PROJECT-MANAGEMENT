; PHP-FPM configuration for the application image. This file replaces the
; distribution's php-fpm.conf entirely (supervisord passes it via
; --fpm-config), so pool.d/www.conf is not loaded and cannot conflict.

[global]
; Log to the container's stderr rather than /var/log, which www-data cannot
; write to.
error_log = /proc/self/fd/2
daemonize = no
log_limit = 8192

[www]
; nginx and FPM share the container, so a unix socket in a writable location
; beats a TCP port. user/group are intentionally omitted: the container
; already runs as www-data and FPM ignores them when not started as root.
listen = /tmp/php-fpm.sock
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Configuration reaches the app as container environment variables (APP_KEY,
; DB_*, MAIL_*, …), so workers must not get a cleared environment.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

php_admin_value[expose_php] = Off
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 512M
